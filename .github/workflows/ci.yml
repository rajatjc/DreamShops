name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Runs every test, including PostgresIntegrationTest against a PostgreSQL container.
      - run: ./mvnw -B verify

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build -d --wait
      - name: Log in as the admin and list products
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:9193/api/v1/products >/dev/null && break; sleep 2; done
          curl -fsS -X POST http://localhost:9193/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"email": "admin@dreamshops.local", "password": "admin-password"}' | grep -q '"token"'
          curl -fsS http://localhost:9193/v3/api-docs | grep -q '"DreamShops API"'
      - name: Logs
        if: failure()
        run: docker compose logs
