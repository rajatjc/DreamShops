# This file replaces src/main/resources/application.properties in tests, so repeat what the app needs.
api.prefix=/api/v1

# Tests run against an in-memory H2 database, so they don't need a database server.
spring.datasource.url=jdbc:h2:mem:dreamshops;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
