# Loaded on top of src/main/resources/application.properties during tests.
# Tests run against an in-memory H2 database, so they don't need a database server.
# (PostgresIntegrationTest swaps in a real PostgreSQL when Docker is available.)
spring.datasource.url=jdbc:h2:mem:dreamshops;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=test-secret-that-is-at-least-32-bytes-long
app.admin.email=admin@test.example
app.admin.password=admin-password
