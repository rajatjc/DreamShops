spring.application.name=dreamshops

server.port=9193
api.prefix=/api/v1

# JWT signing key (at least 32 bytes) and token lifetime. Without a key a random one is used per run.
app.jwt.secret=${JWT_SECRET:}
app.jwt.lifetime=PT1H
# First admin account, created at startup if it doesn't exist
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Image uploads: 5 MB per file, up to 25 MB per request
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Database connection: override with DB_URL, DB_USERNAME and DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dream_shops_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA (Hibernate) properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
